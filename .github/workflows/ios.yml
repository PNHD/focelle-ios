name: iOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  build-test-screenshot:
    runs-on: macos-26
    # Run 54 hit the old 10-minute cap at the screenshot step; run 52 needed 6.8.
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    steps:
      - uses: actions/checkout@v6

      - name: Validate app configuration
        run: /usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' Focelle/Info.plist

      - name: Lint Swift
        run: swift format lint --recursive --strict Focelle FocelleTests

      - name: Boot iPhone 17e simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '.devices["com.apple.CoreSimulator.SimRuntime.iOS-26-4"][] | select(.name == "iPhone 17e") | .udid')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl shutdown all 2>/dev/null || true
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build and test on iPhone 17e simulator
        run: |
          set -o pipefail
          mkdir -p artifacts logs
          xcodebuild \
            -project Focelle.xcodeproj \
            -scheme Focelle \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath DerivedData \
            -resultBundlePath artifacts/FocelleTests.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            CODE_SIGNING_ALLOWED=NO \
            test | tee logs/test.log

      - name: Build unsigned device IPA
        run: |
          set -o pipefail
          xcodebuild \
            -project Focelle.xcodeproj \
            -scheme Focelle \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO \
            build | tee logs/release-device.log
          mkdir -p artifacts/Payload
          cp -R DerivedDataDevice/Build/Products/Release-iphoneos/Focelle.app artifacts/Payload/
          (
            cd artifacts
            ditto -c -k --sequesterRsrc --keepParent Payload Focelle-unsigned.ipa
            rm -rf Payload
          )

      # ponytail: report only; assert once a known-good device layout exists.
      - name: Report device app linkage
        continue-on-error: true
        run: |
          APP=DerivedDataDevice/Build/Products/Release-iphoneos/Focelle.app
          {
            echo "== embedded frameworks =="
            ls -1 "$APP/Frameworks" 2>/dev/null || echo "(none)"
            echo "== linked dylibs =="
            otool -L "$APP/Focelle"
            echo "== rpaths =="
            otool -l "$APP/Focelle" | grep -A2 LC_RPATH || echo "(none)"
            echo "== signed entitlements =="
            codesign -d --entitlements :- "$APP" 2>&1 || true
            echo "== Info.plist =="
            for key in FocelleCloudKitContainer GADApplicationIdentifier; do
              printf '%s = ' "$key"
              /usr/libexec/PlistBuddy -c "Print :$key" "$APP/Info.plist" 2>/dev/null || echo "(missing)"
            done
            for key in FocelleAIEndpoint FocelleAISharedToken; do
              value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$APP/Info.plist" 2>/dev/null || true)
              echo "$key = ${#value} chars"
            done
          } | tee logs/device-linkage.log

      - name: Capture onboarding screen
        run: |
          xcrun simctl install "$DEVICE_ID" DerivedData/Build/Products/Debug-iphonesimulator/Focelle.app
          LAUNCH_OUTPUT=$(xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.pnhd.focelle)
          echo "$LAUNCH_OUTPUT"
          APP_PID=${LAUNCH_OUTPUT##*: }
          sleep 2
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            xcrun simctl spawn "$DEVICE_ID" log show \
              --last 3m \
              --style compact \
              --predicate 'process == "Focelle"' | tee logs/app-launch.log || true
            find "$HOME/Library/Logs/DiagnosticReports" \
              -maxdepth 1 \
              -name 'Focelle*' \
              -exec cp {} logs/ \;
            exit 1
          fi
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/focelle-onboarding.png

      - name: Upload logs and screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: focelle-ios-ci
          path: |
            artifacts/
            logs/
          if-no-files-found: warn
