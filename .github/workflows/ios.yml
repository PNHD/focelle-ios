name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-screenshot:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Build without signing
        run: |
          set -o pipefail
          mkdir -p artifacts logs
          xcodebuild \
            -project Focelle.xcodeproj \
            -scheme Focelle \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee logs/build.log

      - name: Test on iPhone 17e simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Focelle.xcodeproj \
            -scheme Focelle \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17e,OS=26.4.1' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test | tee logs/test.log

      - name: Capture placeholder screen
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '.devices["com.apple.CoreSimulator.SimRuntime.iOS-26-4"][] | select(.name == "iPhone 17e") | .udid')
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" DerivedData/Build/Products/Debug-iphonesimulator/Focelle.app
          xcrun simctl launch "$DEVICE_ID" com.pnhd.focelle
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/focelle-placeholder.png

      - name: Upload logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focelle-ios-ci
          path: |
            artifacts/
            logs/
          if-no-files-found: warn
